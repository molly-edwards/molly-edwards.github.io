<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Cookie Code Clicker</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="game-container">
            <header>
              <h1> Cookie Clicker</h1> 
              <h2 id="score-display">0 cookies</h2>
              <button id="main-button" onclick="writeCode()">Grab Cookie</button>
            </header>

            <main id="shop">
                <h3>Bakery (Manual Upgrade)</h3>
                <p>Current Click Power: <span id="power-display">1</span></p>
                <button id="upgrade-button" onClick="buyKeyboard()">
                    Buy Oven (Cost:<span id="cost-display">50</span>)
                </button>
                
                <h3>Hiring Department (Auto Clicking)</h3>
                <p>Active Grandmas: <span id="intern-display">0</span></p>
                <button id="intern-button" onClick="buyIntern()">
                    Hire Grandma (Cost:<span id="cost-intern-display">100</span>)
                </button>
            </main>
        </div>
        <script src="script.js"></script>
    </body>
</html>
