<!DOCTYPE html>

<html lang="en">
<head>
<title>Table Example Day 4
</title>
<body>
<Table>
    <thead>
        <tr>
            <th>Cell 1</th>
            <th>Cell 2</th>
            <th>Cell 3</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Data 1</td>
            <td>Data 2</td>
            <td>Data 3</td>
        </tr>
    </tbody>
    <tfoot>
        <Tr>
            <td colspan="3">Foot 1</td>
            <td>Foot 2</td>
            <td>Foot 3</td>
        </Tr>
    </tfoot>
</Table>
</body>
</head>
</html>
