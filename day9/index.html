<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="A checklist for packing your bag for Carolina game day."
  >
  <title>Carolina Game Day Checklist</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main class="container">
    <header>
      <h1>Carolina Game Day Checklist</h1>
      <p>Pack your Game Day Bag, then get ready to cheer on the Gamecocks!</p>
    </header>

    <section aria-labelledby="add-item-heading">
      <h2 id="add-item-heading">Add an Item</h2>

      <form id="item-form">
        <label for="item-input">Add an item to your bag</label>
        <input
          id="item-input"
          name="item"
          type="text"
          placeholder="Example: Clear stadium bag"
          required
        >
        <button type="submit">Add to Game Day Bag</button>
      </form>
    </section>

    <section class="bag-tab" aria-labelledby="bag-heading">
      <h2 id="bag-heading">🐔 Game Day Bag</h2>

      <ul id="checklist"></ul>
    </section>
  </main>
</body>
</html>
