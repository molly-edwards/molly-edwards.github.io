
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="A checklist for packing your bag for Carolina game day."
  >
  <title>Carolina Game Day Checklist</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main class="container">
    <header>
      <h1>Carolina Game Day Checklist</h1>
      <p>Make sure your bag is ready before game day.</p>
    </header>

    <section aria-labelledby="add-item-heading">
      <h2 id="add-item-heading">Add an Item</h2>

      <form id="item-form">
        <label for="item-input">Add an item to your bag</label>
        <input
          id="item-input"
          name="item"
          type="text"
          placeholder="Example: Clear stadium bag"
          required
        >
        <button type="submit">Add Item</button>
      </form>
    </section>

    <section aria-labelledby="checklist-heading">
      <h2 id="checklist-heading">My Checklist</h2>

      <ul id="checklist">
        <li>
          <input id="clear-bag" name="packing-item" type="checkbox">
          <label for="clear-bag">Clear stadium bag</label>
          <button
            class="remove-button"
            type="button"
            aria-label="Remove clear stadium bag"
          >
            Remove
          </button>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
